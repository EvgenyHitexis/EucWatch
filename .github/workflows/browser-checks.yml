# Scheduled browser checks (#79): ./scripts/setup.sh, then EUCWATCH_BROWSER_CHECKS=1 ./scripts/check.sh,
# which adds the launch smoke and the Chrome CDP flows to everything the check workflow runs.
# Not a required check: it runs only on a schedule and on demand, never on push or pull request,
# so a failure records history without blocking a merge. The check workflow stays as #67 set it.
# The flows use the simulated wheel and fake BLE clients only. No Bluetooth, wheel, horn or watch
# deployment, and nothing from experiments/wheel-verification/. EUCWATCH_WRITE_EVIDENCE stays unset,
# so evidence goes to .test-output/ and is uploaded when the job fails.
# GitHub runs schedule and workflow_dispatch only from the workflow file on the default branch.
name: browser-checks

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-24.04
    # A green run took 3.5 minutes (run 44567934467). Each browser wait times out after 15 s, so a
    # stuck flow fails rather than hangs; this cap covers a slow runner and any wait that escapes that.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # uv installs Python 3.12 for experiments/laptop-feasibility (requires-python ==3.12.*).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      # tests/support.py starts the google-chrome that the ubuntu-24.04 image provides.
      - name: Chrome version
        run: |
          command -v google-chrome || { echo "::error::google-chrome is not on PATH"; exit 1; }
          google-chrome --version
      - run: ./scripts/setup.sh
      - run: ./scripts/check.sh
        env:
          EUCWATCH_BROWSER_CHECKS: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-output/
          # .test-output/ is a dot directory, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
